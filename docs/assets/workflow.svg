<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">从口播稿到可编辑竖屏视频的工作流</title>
  <desc id="desc">口播稿经过语音时间轴、语义场景拆分和模板渲染，最终生成包含字幕与音频的可编辑时间线。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1b30"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43e7ff"/>
      <stop offset="1" stop-color="#8b6cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43e7ff"/>
    </marker>
  </defs>

  <rect width="1200" height="280" fill="url(#background)"/>
  <g opacity=".16" stroke="#43e7ff">
    <path d="M0 56H1200M0 112H1200M0 168H1200M0 224H1200"/>
    <path d="M120 0V280M240 0V280M360 0V280M480 0V280M600 0V280M720 0V280M840 0V280M960 0V280M1080 0V280"/>
  </g>

  <text x="48" y="44" fill="#eafbff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" font-weight="700" letter-spacing="2">SCRIPT → EDITABLE MOTION CARD VIDEO</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <g transform="translate(48 86)">
      <rect width="176" height="116" fill="#0d1d31" stroke="#f2772b" stroke-width="2"/>
      <rect width="7" height="116" fill="#f2772b"/>
      <text x="24" y="42" fill="#f9a365" font-size="14" font-weight="700">INPUT</text>
      <text x="24" y="79" fill="#ffffff" font-size="25" font-weight="800">口播稿</text>
    </g>

    <g transform="translate(278 86)">
      <rect width="176" height="116" fill="#0d1d31" stroke="#43e7ff" stroke-width="2"/>
      <path d="M24 35h9v25h11V43h11v17h11V28h11v32h11" fill="none" stroke="#43e7ff" stroke-width="3"/>
      <text x="24" y="91" fill="#ffffff" font-size="22" font-weight="800">语音时间轴</text>
    </g>

    <g transform="translate(508 86)">
      <rect width="176" height="116" fill="#0d1d31" stroke="#43e7ff" stroke-width="2"/>
      <circle cx="35" cy="43" r="8" fill="#43e7ff"/>
      <circle cx="68" cy="28" r="7" fill="#8b6cff"/>
      <circle cx="75" cy="62" r="7" fill="#ff4fd8"/>
      <path d="M42 39l18-8M42 48l25 11" stroke="#bfefff" stroke-width="2"/>
      <text x="24" y="91" fill="#ffffff" font-size="22" font-weight="800">语义场景</text>
    </g>

    <g transform="translate(738 86)">
      <rect width="176" height="116" fill="#0d1d31" stroke="#8b6cff" stroke-width="2"/>
      <rect x="24" y="24" width="56" height="37" fill="#2a1f22" stroke="#f2772b"/>
      <rect x="92" y="24" width="56" height="37" fill="#0b2438" stroke="#43e7ff"/>
      <text x="24" y="91" fill="#ffffff" font-size="22" font-weight="800">模板渲染</text>
    </g>

    <g transform="translate(968 86)">
      <rect width="184" height="116" fill="#10253a" stroke="url(#cyanLine)" stroke-width="2"/>
      <rect x="24" y="24" width="136" height="10" fill="#43e7ff"/>
      <rect x="24" y="42" width="101" height="10" fill="#8b6cff"/>
      <rect x="24" y="60" width="121" height="10" fill="#f2772b"/>
      <text x="24" y="99" fill="#ffffff" font-size="22" font-weight="800">可编辑时间线</text>
    </g>
  </g>

  <g stroke="#43e7ff" stroke-width="3" fill="none" marker-end="url(#arrow)" filter="url(#glow)">
    <path d="M232 144H266"/>
    <path d="M462 144H496"/>
    <path d="M692 144H726"/>
    <path d="M922 144H956"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" font-weight="700">
    <text x="763" y="225" fill="#f9a365">EDITORIAL</text>
    <text x="839" y="225" fill="#43e7ff">NEON</text>
    <text x="968" y="225" fill="#a9c6dc">背景 · 动态内容 · 旁白 · 字幕 · 配乐</text>
  </g>
</svg>
